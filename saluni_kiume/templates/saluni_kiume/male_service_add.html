{% extends "base.html" %}

{% block content %}
<h2>Add Service for {{ salon.name }}</h2>

<form method="POST">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div>
        <label>Name:</label>
        {{ form.name }}
    </div>
    <div>
        <label>Description:</label>
        {{ form.description }}
    </div>
    <div>
        <label>Price (KES):</label>
        {{ form.price }}
    </div>
    <div>
        <label>Duration (minutes):</label>
        {{ form.duration_minutes }}
    </div>
    <div>
        <label>Active:</label>
        {{ form.active }}
    </div>
    <button type="submit">Add Service</button>
</form>
{% endblock %}
